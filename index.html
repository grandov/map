<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Домофоны — Нижний Новгород</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root{--ac:#2563eb;--bg:#fff;--tx:#0f172a;--mu:#64748b;--ln:#e2e8f0}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--tx)}
  #map{position:fixed;inset:0}
  .ui{position:fixed;z-index:1000}
  #search{top:calc(10px + env(safe-area-inset-top));left:10px;right:10px;max-width:460px;display:flex;background:var(--bg);border-radius:14px;box-shadow:0 2px 10px #0003;overflow:hidden}
  #search input{flex:1;min-width:0;border:0;outline:0;font-size:16px;padding:14px 14px;background:transparent}
  #search button{border:0;background:var(--ac);color:#fff;font-size:15px;font-weight:600;padding:0 18px}
  #fabs{right:10px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:10px}
  .fab{width:46px;height:46px;border-radius:50%;border:0;background:var(--bg);box-shadow:0 2px 8px #0003;display:grid;place-items:center;color:var(--tx);padding:0}
  .fab:active{transform:scale(.92)}
  .fab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  #toast{top:calc(68px + env(safe-area-inset-top));left:50%;transform:translate(-50%,-8px);background:#0f172ae6;color:#fff;font-size:13px;padding:8px 14px;border-radius:20px;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;max-width:90%;text-align:center}
  #toast.on{opacity:1;transform:translate(-50%,0)}
  #sheet{left:0;right:0;bottom:0;background:var(--bg);border-radius:20px 20px 0 0;padding:10px 16px calc(16px + env(safe-area-inset-bottom));box-shadow:0 -4px 20px #0004;transform:translateY(105%);transition:transform .25s ease;max-width:520px;margin:0 auto}
  #sheet.open{transform:none}
  #sheet i{display:block;width:40px;height:4px;border-radius:2px;background:var(--ln);margin:0 auto 12px}
  #addr{font-weight:700;font-size:17px;margin-bottom:10px}
  #sheet label{font-size:12px;color:var(--mu)}
  #sheet input{width:100%;font-size:20px;padding:11px 12px;margin:3px 0 10px;border:1.5px solid var(--ln);border-radius:10px;outline:0}
  #sheet input:focus{border-color:var(--ac)}
  .row{display:flex;gap:8px}
  .row button{flex:1;padding:13px;font-size:16px;font-weight:600;border-radius:12px;border:0;background:#f1f5f9;color:var(--tx)}
  .row .ok{flex:2;background:var(--ac);color:#fff}
  .leaflet-control-attribution{font-size:9px}
</style>
</head>
<body>
<div id="map"></div>
<form id="search" class="ui"><input id="q" type="search" placeholder="Улица и дом, например Ларина 5" enterkeyhint="search"><button>Найти</button></form>
<div id="fabs" class="ui">
  <button class="fab" id="loc" title="Где я"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="7"/></svg></button>
  <button class="fab" id="off" title="Скачать район для быстрой работы"><svg viewBox="0 0 24 24"><path d="M12 3v12M7 11l5 5 5-5M5 21h14"/></svg></button>
  <button class="fab" id="exp" title="Сохранить копию кодов"><svg viewBox="0 0 24 24"><path d="M12 15V3M7 8l5-5 5 5M5 21h14v-4"/></svg></button>
  <button class="fab" id="imp" title="Загрузить копию кодов"><svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 17v4h14v-4"/></svg></button>
</div>
<div id="toast" class="ui"></div>
<div id="sheet" class="ui"><i></i><div id="addr"></div>
  <label>Код домофона</label><input id="code" placeholder="например 1234К" autocomplete="off">
  <label>Заметка</label><input id="note" placeholder="подъезд, этаж…" autocomplete="off">
  <div class="row"><button id="del">Удалить</button><button id="cls">Закрыть</button><button id="ok" class="ok">Сохранить</button></div>
</div>
<input type="file" id="file" accept=".json" hidden>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const KEY = 'nn_domofon_codes_v1';
let data = {}; try { data = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) {}
const saveData = () => localStorage.setItem(KEY, JSON.stringify(data));

// ---------- интерфейс ----------
let tt; function toast(t, ms = 2200){ const e = $('toast'); e.textContent = t; e.classList.add('on'); clearTimeout(tt); if (ms) tt = setTimeout(() => e.classList.remove('on'), ms); }
const esc = s => String(s || '');

// ---------- карта ----------
const AREA = {s: 56.255, w: 43.86, n: 56.345, e: 44.06}; // верхняя часть города
const map = L.map('map', {zoomControl: false, preferCanvas: true, maxBounds: [[56.2, 43.78], [56.4, 44.16]], minZoom: 12, zoomSnap: .5})
  .setView([56.3175, 43.9965], 16.5);
L.control.zoom({position: 'bottomleft'}).addTo(map);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom: 19, attribution: '© OpenStreetMap', keepBuffer: 4}).addTo(map);

const style = id => data[id] && data[id].code
  ? {color:'#15803d', weight:1, fillColor:'#22c55e', fillOpacity:.6}
  : {color:'#2563eb', weight:1, fillColor:'#3b82f6', fillOpacity:.14};

// ---------- кэш в IndexedDB ----------
const idb = new Promise(r => { try { const q = indexedDB.open('nnmap', 1); q.onupgradeneeded = () => q.result.createObjectStore('c'); q.onsuccess = () => r(q.result); q.onerror = () => r(null); } catch (e) { r(null); } });
const dbGet = async k => { const d = await idb; if (!d) return; return new Promise(r => { const q = d.transaction('c').objectStore('c').get(k); q.onsuccess = () => r(q.result); q.onerror = () => r(); }); };
const dbSet = async (k, v) => { const d = await idb; if (d) d.transaction('c', 'readwrite').objectStore('c').put(v, k); };

// ---------- ячейки зданий ----------
const CH = .01, CW = .016, MIRRORS = ['https://overpass-api.de/api/interpreter', 'https://overpass.kumi.systems/api/interpreter'];
const ck = (i, j) => i + '_' + j;
let chain = Promise.resolve(); const pending = new Map();

async function netCell(i, j){
  const q = `[out:json][timeout:40];way["building"](${i*CH},${j*CW},${(i+1)*CH},${(j+1)*CW});out tags geom;`;
  for (let t = 0; t < 4; t++) {
    try {
      const r = await fetch(MIRRORS[t % 2], {method: 'POST', body: 'data=' + encodeURIComponent(q)});
      if (!r.ok) throw 0;
      const js = await r.json();
      return js.elements.filter(w => w.geometry).map(w => ({
        id: w.id, s: w.tags['addr:street'] || '', h: w.tags['addr:housenumber'] || '', n: w.tags.name || '',
        p: w.geometry.map(g => [+g.lat.toFixed(6), +g.lon.toFixed(6)])
      }));
    } catch (e) { await new Promise(r => setTimeout(r, 1500 * (t + 1))); }
  }
  throw new Error('net');
}
function getCell(i, j){
  const k = ck(i, j);
  if (pending.has(k)) return pending.get(k);
  const p = (async () => {
    const c = await dbGet(k); if (c) return c;
    const d = await (chain = chain.catch(() => {}).then(() => netCell(i, j)));
    dbSet(k, d); return d;
  })();
  pending.set(k, p); p.catch(() => pending.delete(k)); p.then(() => setTimeout(() => pending.delete(k), 0));
  return p;
}

const shown = new Map(), byId = new Map(); let wanted = new Set();
function open(w){
  const title = w.s ? w.s + (w.h ? ', ' + w.h : '') : (w.n || 'Дом без адреса');
  window.cur = {id: w.id, title};
  const d = data[w.id] || {};
  $('addr').textContent = title; $('code').value = d.code || ''; $('note').value = d.note || '';
  $('sheet').classList.add('open'); setTimeout(() => $('code').focus(), 260);
}
async function showCell(i, j){
  const k = ck(i, j); if (shown.has(k)) return;
  const d = await getCell(i, j); if (shown.has(k)) return;
  const g = L.featureGroup(); g._polys = [];
  for (const w of d) {
    const p = L.polygon(w.p, style(w.id)); p._w = w; p.on('click', () => open(w));
    g.addLayer(p); g._polys.push(p); byId.set(w.id, p);
  }
  shown.set(k, g); g.addTo(map);
}
async function update(){
  if (map.getZoom() < 15.5) { shown.forEach(g => map.removeLayer(g)); shown.clear(); toast('Приблизьте карту, чтобы увидеть дома', 1500); return; }
  const b = map.getBounds(); wanted = new Set(); const list = [];
  for (let i = Math.floor(b.getSouth()/CH) - 1; i <= Math.floor(b.getNorth()/CH) + 1; i++)
    for (let j = Math.floor(b.getWest()/CW) - 1; j <= Math.floor(b.getEast()/CW) + 1; j++) { wanted.add(ck(i, j)); list.push([i, j]); }
  shown.forEach((g, k) => { if (!wanted.has(k)) { map.removeLayer(g); shown.delete(k); } });
  // сначала центральные ячейки
  const c = map.getCenter(); list.sort((a, b) => Math.hypot(a[0]*CH - c.lat, a[1]*CW - c.lng) - Math.hypot(b[0]*CH - c.lat, b[1]*CW - c.lng));
  let loading = list.filter(([i, j]) => !shown.has(ck(i, j))).length; if (loading) toast('Загружаю дома…', 0);
  for (const [i, j] of list) { try { await showCell(i, j); } catch (e) { toast('Нет связи с сервером домов'); } if (--loading <= 0) $('toast').classList.remove('on'); }
}
let mt; map.on('moveend', () => { clearTimeout(mt); mt = setTimeout(update, 150); }); update();

// ---------- редактор кода ----------
const close = () => $('sheet').classList.remove('open');
$('cls').onclick = close;
$('ok').onclick = () => {
  const code = $('code').value.trim(), note = $('note').value.trim(), id = cur.id;
  if (code || note) data[id] = {code, note, addr: cur.title}; else delete data[id];
  saveData(); byId.get(id) && byId.get(id).setStyle(style(id)); close(); toast('Сохранено', 1200);
};
$('del').onclick = () => { delete data[cur.id]; saveData(); byId.get(cur.id) && byId.get(cur.id).setStyle(style(cur.id)); close(); };
map.on('click', close);

// ---------- поиск ----------
function inside(pt, p){
  const r = p._w.p; let c = false;
  for (let i = 0, j = r.length - 1; i < r.length; j = i++)
    if ((r[i][0] > pt.lat) !== (r[j][0] > pt.lat) && pt.lng < (r[j][1]-r[i][1]) * (pt.lat-r[i][0]) / (r[j][0]-r[i][0]) + r[i][1]) c = !c;
  return c;
}
$('search').onsubmit = async e => {
  e.preventDefault(); $('q').blur();
  const q = $('q').value.trim(); if (!q) return;
  toast('Ищу…', 0);
  try {
    const u = 'https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&accept-language=ru&bounded=1&viewbox=43.78,56.4,44.16,56.2&q=' + encodeURIComponent('Нижний Новгород, ' + q);
    const res = (await (await fetch(u)).json())[0];
    if (!res) return toast('Адрес не найден. Пример: «Ларина 5»', 3000);
    const pt = L.latLng(+res.lat, +res.lon);
    map.setView(pt, 18, {animate: false});
    await showCell(Math.floor(pt.lat/CH), Math.floor(pt.lng/CW));
    let best = res.osm_type === 'way' ? byId.get(res.osm_id) : null;
    if (!best) { const g = shown.get(ck(Math.floor(pt.lat/CH), Math.floor(pt.lng/CW))); best = g && g._polys.find(p => inside(pt, p)); }
    if (best) { open(best._w); $('toast').classList.remove('on'); } else toast('Место найдено — нажмите на дом', 3000);
  } catch (err) { toast('Поиск не сработал, проверьте интернет', 3000); }
};

// ---------- кнопки ----------
$('loc').onclick = () => { toast('Определяю место…', 0); map.locate({setView: true, maxZoom: 18, enableHighAccuracy: true}); };
map.on('locationfound', () => $('toast').classList.remove('on')); map.on('locationerror', () => toast('Нет доступа к геолокации', 2500));

let dl = false;
$('off').onclick = async () => {
  if (dl) return; dl = true;
  const cells = [];
  for (let i = Math.floor(AREA.s/CH); i <= Math.floor(AREA.n/CH); i++) for (let j = Math.floor(AREA.w/CW); j <= Math.floor(AREA.e/CW); j++) cells.push([i, j]);
  let n = 0, fail = 0;
  for (const [i, j] of cells) {
    toast(`Скачиваю район: ${n} из ${cells.length}`, 0);
    try { if (!(await dbGet(ck(i, j)))) { await getCell(i, j); await new Promise(r => setTimeout(r, 1200)); } } catch (e) { fail++; }
    n++;
  }
  dl = false; toast(fail ? `Готово, не скачались ячеек: ${fail}. Нажмите ещё раз` : 'Район скачан — теперь всё работает быстро', 4000);
};
$('exp').onclick = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 1)], {type: 'application/json'})); a.download = 'domofon-codes.json'; a.click(); };
$('imp').onclick = () => $('file').click();
$('file').onchange = e => {
  const f = e.target.files[0]; if (!f) return; const rd = new FileReader();
  rd.onload = () => { try { Object.assign(data, JSON.parse(rd.result)); saveData(); byId.forEach((p, id) => p.setStyle(style(id))); toast('Копия загружена'); } catch (x) { toast('Файл не подходит'); } };
  rd.readAsText(f);
};
</script>
</body>
</html>
