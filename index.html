<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Домофоны — Нижний Новгород (2ГИС)</title>
<style>
  html,body{height:100%;margin:0;font-family:system-ui,sans-serif;overflow:hidden}
  #map{position:absolute;inset:0}
  #bar{position:absolute;z-index:5;top:10px;left:10px;right:10px;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}
  #bar>*{pointer-events:auto;background:#fff;border:1px solid #ccc;border-radius:8px;padding:7px 10px;font-size:13px;box-shadow:0 1px 4px #0003}
  #sf{display:flex;gap:4px;padding:4px;width:100%;max-width:440px}
  #sf input{flex:1;min-width:0;font-size:16px;padding:6px;border:1px solid #ccc;border-radius:6px}
  button{cursor:pointer;font-size:14px;padding:7px 12px}
  #sheet{position:absolute;z-index:6;left:0;right:0;bottom:0;background:#fff;padding:14px;border-radius:14px 14px 0 0;box-shadow:0 -2px 10px #0004;display:none}
  #sheet input{width:100%;box-sizing:border-box;padding:9px;font-size:18px;margin:4px 0 8px;border:1px solid #bbb;border-radius:6px}
  #sheet b{display:block;margin-bottom:6px}
  #sheet label{font-size:12px;color:#555}
</style>
</head>
<body>
<div id="map"></div>
<div id="bar">
  <form id="sf"><input id="q" type="search" placeholder="Улица и дом, напр. Ларина 5"><button>Найти</button></form>
  <span id="status">Нажмите на дом на карте</span>
  <button id="exp">Сохранить копию</button>
  <button id="imp">Загрузить копию</button>
  <button id="keybtn">Ключ 2ГИС</button>
  <input type="file" id="file" accept=".json" hidden>
</div>
<div id="sheet">
  <b id="addr"></b>
  <label>Код домофона</label>
  <input id="code" type="text" placeholder="например 1234К">
  <label>Заметка</label>
  <input id="note" type="text" placeholder="подъезд, этаж…">
  <button id="save">Сохранить</button>
  <button id="del">Удалить</button>
  <button id="close">Закрыть</button>
</div>

<script src="https://mapgl.2gis.com/api/js/v1"></script>
<script>
const DK = 'nn_domofon_2gis_v1', KK = 'nn_2gis_key';
let data = {};
try { data = JSON.parse(localStorage.getItem(DK) || '{}'); } catch (e) {}
const saveData = () => localStorage.setItem(DK, JSON.stringify(data));
const $ = id => document.getElementById(id);
const say = t => $('status').textContent = t;

function askKey(force){
  let k = localStorage.getItem(KK);
  if (!k || force) {
    k = (prompt('Вставьте API-ключ 2ГИС (platform.2gis.ru → бесплатный демо-ключ):', k || '') || '').trim();
    if (k) localStorage.setItem(KK, k);
  }
  return k;
}
const KEY = askKey(false);
$('keybtn').onclick = () => { if (askKey(true)) location.reload(); };
if (!KEY) say('Нужен ключ 2ГИС — нажмите «Ключ 2ГИС»');

const map = new mapgl.Map('map', {center: [43.9965, 56.3175], zoom: 16.5, key: KEY || 'none', zoomControl: 'bottomLeft'});
let marker = null, cur = null; // cur = {key, addr, mapId}

const API = 'https://catalog.api.2gis.com/3.0/items/geocode?fields=items.point&key=' + encodeURIComponent(KEY || '');
async function geo(params){
  const r = await fetch(API + params);
  const j = await r.json();
  return (j.result && j.result.items) || [];
}

function refresh(){
  map.setSelectedObjects(Object.values(data).map(d => d.mapId).filter(Boolean));
}
map.on('styleload', refresh);
setTimeout(refresh, 1500);

function openSheet(c){
  cur = c;
  const d = data[c.key] || {};
  $('addr').textContent = c.addr;
  $('code').value = d.code || ''; $('note').value = d.note || '';
  $('sheet').style.display = 'block';
  $('code').focus();
}
$('close').onclick = () => { $('sheet').style.display = 'none'; };
$('save').onclick = () => {
  const code = $('code').value.trim(), note = $('note').value.trim();
  if (code || note) data[cur.key] = {code, note, addr: cur.addr, mapId: cur.mapId || (data[cur.key] || {}).mapId};
  else delete data[cur.key];
  saveData(); refresh(); $('sheet').style.display = 'none'; say('Сохранено');
};
$('del').onclick = () => { delete data[cur.key]; saveData(); refresh(); $('sheet').style.display = 'none'; };

map.on('click', async e => {
  if (!e.target) return;
  const mapId = e.target.id;
  const [lng, lat] = e.lngLat;
  say('Определяю адрес…');
  try {
    const it = (await geo(`&type=building&lon=${lng}&lat=${lat}`))[0];
    if (it) { openSheet({key: String(it.id), addr: it.address_name || it.full_name || it.name, mapId}); say('Нажмите на дом на карте'); }
    else { openSheet({key: 'm' + mapId, addr: 'Дом без адреса', mapId}); say('Адрес не определён'); }
  } catch (err) { openSheet({key: 'm' + mapId, addr: 'Дом (адрес не загрузился)', mapId}); say('Ошибка сети или ключа'); }
});

// Быстрый поиск: сначала среди сохранённых, потом геокодер 2ГИС
$('sf').onsubmit = async e => {
  e.preventDefault();
  const q = $('q').value.trim().toLowerCase();
  if (!q) return;
  const words = q.replace(/[.,]/g, ' ').split(/\s+/).filter(Boolean);
  const local = Object.entries(data).find(([k, d]) => words.every(w => (d.addr || '').toLowerCase().includes(w)));
  say('Ищу…');
  try {
    const it = (await geo('&type=building&q=' + encodeURIComponent('Нижний Новгород, ' + $('q').value.trim())))[0];
    if (!it || !it.point) {
      if (local) { openSheet({key: local[0], addr: local[1].addr}); say('Найдено среди сохранённых'); }
      else say('Адрес не найден. Попробуйте: «Ларина 5»');
      return;
    }
    map.setCenter([it.point.lon, it.point.lat]); map.setZoom(18);
    if (marker) marker.destroy();
    marker = new mapgl.Marker(map, {coordinates: [it.point.lon, it.point.lat]});
    openSheet({key: String(it.id), addr: it.address_name || it.full_name || it.name});
    say('Найдено');
  } catch (err) { say('Ошибка сети или ключа'); }
};

$('exp').onclick = () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 1)], {type: 'application/json'}));
  a.download = 'domofon-codes-2gis.json'; a.click();
};
$('imp').onclick = () => $('file').click();
$('file').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => { try { Object.assign(data, JSON.parse(rd.result)); saveData(); refresh(); say('Копия загружена'); } catch (err) { alert('Файл не подходит'); } };
  rd.readAsText(f);
};
</script>
</body>
</html>
